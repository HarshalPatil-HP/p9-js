<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lumora — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    body { font-family: 'DM Sans', sans-serif; background: #0a0a0f; color: #f0ede8; }
    h1, h2 { font-family: 'Playfair Display', serif; }
    .grain {
      position: fixed; inset: 0; pointer-events: none; z-index: 50; opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 200px;
    }
    @keyframes fadeUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .fade-up { animation: fadeUp 0.7s ease forwards; }
    .delay-1 { animation-delay: 0.1s; opacity:0; }
    .delay-2 { animation-delay: 0.2s; opacity:0; }
    .delay-3 { animation-delay: 0.3s; opacity:0; }
    .delay-4 { animation-delay: 0.4s; opacity:0; }
    .delay-5 { animation-delay: 0.5s; opacity:0; }
    input:focus { outline: none; }
    .input-field {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      transition: border-color 0.2s, background 0.2s;
    }
    .input-field:focus {
      background: rgba(255,255,255,0.06);
      border-color: rgba(234,179,8,0.5);
      box-shadow: 0 0 0 3px rgba(234,179,8,0.08);
    }
    .btn-main {
      background: #eab308;
      transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
    }
    .btn-main:hover {
      background: #facc15;
      transform: translateY(-1px);
      box-shadow: 0 8px 30px rgba(234,179,8,0.3);
    }
    .btn-main:active { transform: translateY(0); }
    .divider-line {
      flex: 1; height: 1px; background: rgba(255,255,255,0.07);
    }
    .social-btn {
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.03);
      transition: background 0.2s, border-color 0.2s;
    }
    .social-btn:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body class="min-h-screen flex overflow-x-hidden">
  <div class="grain"></div>

  <!-- Left panel — branding -->
  <div class="hidden lg:flex flex-col justify-between w-1/2 p-12 border-r border-white/5 relative overflow-hidden">
    <div class="absolute inset-0 bg-gradient-to-br from-yellow-500/8 via-transparent to-transparent pointer-events-none"></div>
    <div class="absolute bottom-[-150px] left-[-150px] w-[400px] h-[400px] rounded-full bg-yellow-500/5 blur-[100px]"></div>

    <a href="landing.html" class="text-xl font-black" style="font-family:'Playfair Display',serif">Lumora</a>

    <div>
      <blockquote class="text-3xl font-black leading-tight mb-6 max-w-sm" style="font-family:'Playfair Display',serif">
        "Where scattered thoughts<br/>become <span class="text-yellow-400">clear ideas.</span>"
      </blockquote>
      <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-full bg-yellow-500/20 flex items-center justify-center text-yellow-400 text-xs font-bold">M</div>
        <div>
          <p class="text-sm font-medium">Maya Chen</p>
          <p class="text-white/30 text-xs">Product Designer, Notion</p>
        </div>
      </div>
    </div>

    <p class="text-white/20 text-xs">© 2026 Lumora Inc.</p>
  </div>

  <!-- Right panel — form -->
  <div class="flex-1 flex items-center justify-center px-6 py-12">
    <div class="w-full max-w-sm">

      <!-- Mobile logo -->
      <div class="lg:hidden mb-8 fade-up">
        <span class="text-xl font-black" style="font-family:'Playfair Display',serif">Lumora</span>
      </div>

      <div class="fade-up delay-1">
        <h1 class="text-3xl font-black mb-1">Welcome back</h1>
        <p class="text-white/35 text-sm">Sign in to your workspace</p>
      </div>

      <!-- Social logins -->
      <div class="mt-8 grid grid-cols-2 gap-3 fade-up delay-2">
        <button class="social-btn flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm text-white/60 hover:text-white cursor-pointer">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
          </svg>
          Google
        </button>
        <button class="social-btn flex items-center justify-center gap-2 py-2.5 rounded-xl text-sm text-white/60 hover:text-white cursor-pointer">
          <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
            <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
          </svg>
          GitHub
        </button>
      </div>

      <!-- Divider -->
      <div class="flex items-center gap-4 my-6 fade-up delay-3">
        <div class="divider-line"></div>
        <span class="text-white/25 text-xs">or continue with email</span>
        <div class="divider-line"></div>
      </div>

      <!-- Form -->
      <form class="space-y-4 fade-up delay-4" onsubmit="return false;">
        <div>
          <label class="block text-xs text-white/40 mb-1.5 font-medium">Email address</label>
          <input type="email" placeholder="you@example.com"
            class="input-field w-full rounded-xl px-4 py-3 text-sm text-white placeholder-white/20"/>
        </div>
        <div>
          <label class="block text-xs text-white/40 mb-1.5 font-medium">Password</label>
          <input type="password" placeholder="••••••••"
            class="input-field w-full rounded-xl px-4 py-3 text-sm text-white placeholder-white/20"/>
        </div>
        <div class="flex items-center justify-between">
          <label class="flex items-center gap-2 text-xs text-white/35 cursor-pointer select-none">
            <input type="checkbox" class="accent-yellow-400 w-3.5 h-3.5 rounded"/>
            Remember me
          </label>
          <a href="#" class="text-xs text-yellow-500 hover:text-yellow-400 transition-colors">Forgot password?</a>
        </div>
        <button type="submit" class="btn-main w-full py-3.5 rounded-xl text-black font-medium text-sm mt-2">
          Sign in →
        </button>
      </form>

      <p class="text-center text-xs text-white/25 mt-6 fade-up delay-5">
        Don't have an account?
        <a href="#" class="text-yellow-500 hover:text-yellow-400 transition-colors ml-1">Create one free</a>
      </p>

    </div>
  </div>
</body>
</html>
