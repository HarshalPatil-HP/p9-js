<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do</title>
    <link href="./output.css" rel="stylesheet">
</head>

<body class="bg-gradient-to-br from-black via-gray-900 to-black min-h-screen flex justify-center items-center text-white">

    <div class="w-96 bg-gray-900 p-6 rounded-2xl shadow-2xl border border-gray-700">
        
        <h1 class="text-2xl font-bold text-center mb-5 tracking-wide">
            My To-Do
        </h1>

        <!-- Input + Button -->
        <div class="flex gap-2">
            <input 
                type="text" 
                id="inputs"
                placeholder="Add a task..."
                class="w-full p-3 rounded-lg text-black outline-none focus:ring-2 focus:ring-blue-500"
            >

            <button 
                id="add"
                class="bg-blue-600 hover:bg-blue-700 px-4 rounded-lg transition-all">
                +
            </button>
        </div>

        <!-- Task List -->
        <ul id="lists" class="mt-5 space-y-3"></ul>

    </div>

   <script src="todo.js"></script>
</body>
</html>
